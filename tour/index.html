const slides=[{"title": "Concerto for Industry", "quote": "We are the Concern that plays on your side of the score.", "source": "Manifesto — Concerto for Industry", "kind": "cover", "image": "img/2642dcb789d7.webp", "items": [], "notes": "Every project is a score. Sensors, control loops, users, engineers, economics, ecology — everything must play in tune, or a false note rings out: downtime, an incident, lost profit, a regulator's citation, wasted investment.\n\nMost suppliers in this industry play their own part. One sells sensors, another pumps, a third software, a fourth knowledge. Each part may be excellent on its own. But no one owns how it all sounds together — and the client is left alone with the problem, holding a conductor's baton nobody asked for.\n\nThe cost of an untuned orchestra is not abstract. It is a pump sized by a vendor for a process the subcontractor had already changed; a control loop tuned before anyone mentioned the turnaround; a recipe that yields product but no margin. Fragmented accountability yields fragmented results — and the bill for the fragments always lands on the client's desk.\n\nAKCO is a Concern. From the Latin concernere — to share one matter. From the Italian concerto — to play in concert. We are not a vendor of goods. We are a co-performer.\n\nWe work from inside your team. We work on your sites. We earn our bonuses on your achieved KPIs, not on our sales. We leave when your pain leaves — and we stay until it does.\n\nFrom our own practice we assembled a full ensemble of intelligent instruments: AKSense™ detects the signals, AKFlow™ manages the flows, AKCore™ thinks through the execution, AK.COmm engineering teams deliver the projects, and AKNeuro™ looks into humanity's future. Each can play solo. Together they sound like concernere — one language, one score: AK System.\n\nWe are an engineering school raised on problems the textbooks don't cover. We are the Concern that plays on your side of the score."}, {"title": "Fragmented accountability", "quote": "Fragmented accountability yields fragmented results — and the bill for the fragments always lands on the client's desk.", "source": "Manifesto — Concerto for Industry", "kind": "statement", "image": "", "items": [], "notes": "Every project is a score. Sensors, control loops, users, engineers, economics, ecology — everything must play in tune, or a false note rings out: downtime, an incident, lost profit, a regulator's citation, wasted investment.\n\nMost suppliers in this industry play their own part. One sells sensors, another pumps, a third software, a fourth knowledge. Each part may be excellent on its own. But no one owns how it all sounds together — and the client is left alone with the problem, holding a conductor's baton nobody asked for.\n\nThe cost of an untuned orchestra is not abstract. It is a pump sized by a vendor for a process the subcontractor had already changed; a control loop tuned before anyone mentioned the turnaround; a recipe that yields product but no margin. Fragmented accountability yields fragmented results — and the bill for the fragments always lands on the client's desk.\n\nAKCO is a Concern. From the Latin concernere — to share one matter. From the Italian concerto — to play in concert. We are not a vendor of goods. We are a co-performer.\n\nWe work from inside your team. We work on your sites. We earn our bonuses on your achieved KPIs, not on our sales. We leave when your pain leaves — and we stay until it does.\n\nFrom our own practice we assembled a full ensemble of intelligent instruments: AKSense™ detects the signals, AKFlow™ manages the flows, AKCore™ thinks through the execution, AK.COmm engineering teams deliver the projects, and AKNeuro™ looks into humanity's future. Each can play solo. Together they sound like concernere — one language, one score: AK System.\n\nWe are an engineering school raised on problems the textbooks don't cover. We are the Concern that plays on your side of the score."}, {"title": "Co-engineering", "quote": "AKCO stays — inside your team, on your sites, measured by your KPIs.", "source": "AKCO Positioning", "kind": "photo", "image": "img/5a34abb75a63.webp", "items": ["All under one line of accountability."], "notes": "AKCO is not just a single company: it is a concern built on synergy. It is a group of high-tech businesses joined by one value chain, where each company reinforces the others and every project can draw on the support of all. Today, the group comprises three international companies and two engineering centers in the CIS under one home brand. AKCO deliberately stays open: new partners and like-minded companies can slot into the existing value chain with ease.\n\nThe prefix in the AKCO™ name comes from akıllı in Turkic languages and أكيس (akyas) in Arabic, both meaning “smart, intelligent.” That is the kind of intelligence that we strive for in everything we do: in our approach to life, our ambitions, and the way we conduct business. Our headquarters reflects this philosophy in its own name “Smart Systems,” and proves it in practice by building modern intelligent ecosystems that give our clients’ businesses fresh momentum. We are a full-cycle co-engineering concern, built to help businesses solve their challenges, remove their obstacles, and unlock their full potential.\n\nThe Concern specializes in building closed-loop ecosystems that address various client pains, challenges, and opportunities at different scales: from process improvement through production enhancement to enterprise transformation. Thirty years of accumulated team expertise in designing, constructing, and operating large-scale industrial facilities as well as various related businesses have taken shape in the provision of flexible, scalable, and adaptable business-focused ecosystems supported by advanced AI technologies.\n\nOur ecosystems don't grow in a lab. The diversity of the Concern's businesses and its partner network puts them to work on real operations, with real demands: most are embedded in AKCO's own processes and learn from live situations every day. We call it Proven Inside. Few of our peers can give their products a proving ground like that.\n\nOur difference fits in one word: co-engineering. Suppliers sell you a product and disappear. Contractors finish the job and leave. AKCO stays — inside your team, on your sites, measured by your KPIs. We diagnose the pain before we propose anything, then assemble the right ecosystem — hardware, software, services, and people — to remove it. All under one line of accountability."}, {"title": "AK.Family", "quote": "Every ecosystem brings hardware, software, technology, services, and people together around one business outcome", "source": "AK.Family", "kind": "family", "image": "", "items": ["hardware", "software", "technology", "services", "people"], "notes": "AK.Family is AKCO's portfolio of pre-integrated, AI-powered ecosystems: complete, deployment-ready solutions — each Proven Inside — rather than stand-alone products. An ecosystem is not a fixed bundle: components are selected, added, or swapped to fit the client's object, constraints, and existing systems — when your pain calls for a different mix, the mix is exactly what we engineer.\n\nWhat this section shows are reference configurations: combinations already assembled, run, and proven in live operation — worked examples of the approach, not its limits. Every ecosystem brings hardware, software, technology, services, and people together around one business outcome, and every one is built on AKCO's shared product brands (AKCore™, AKSense™, AKFlow™, AKNeuro™), so the components work together out of the box. The portfolio spans predictive machine diagnostics, unmanned production, intelligent climate, precision agriculture, waste-to-resource technology, mobile power, AI agents for business, full-cycle capital-project delivery, neuromorphic robotics, marketplace operations, and trading."}, {"title": "Pains we eliminate", "quote": "We call them domains, because the term centers on the pain, not the technology.", "source": "Domain Focus", "kind": "domains", "image": "", "items": [], "notes": "AKCO works in eight core areas — and is growing in every one of them. We call them domains, because the term centers on the pain, not the technology. The eXtra is research and development (R&D): the domain for solutions that don't yet exist, built to remove new pains or unlock the potential of clients' businesses.\n\nAKCO deliberately refuses to box itself into specific industries or client segments. Problems in different industries share common roots: decompose the technologies into their processes and operations, and you find the same principles, the same weak points, the same sources of efficiency. That is why knowledge earned in one industry solves problems in another. And in an era when the world's economic and industrial order is being redrawn, closed industry silos are losing their relevance."}, {"title": "Proven Inside", "quote": "Nearly every ecosystem runs its full lifecycle inside the Concern before we offer it to the market.", "source": "Why AKCO", "kind": "proven", "image": "", "items": ["answer calls", "draft proposals", "generate project documentation", "write code", "evaluate project financial models"], "notes": "The reasons clients choose us:\n\nBackground. We came from control rooms, not showrooms. Twenty-plus years of operating industrial automation taught us to analyze the asset, find the real sources of trouble and of efficiency gains, and pick the right solutions and technologies from a crowded field. That discipline — analyze first, understand the root cause, then propose — now runs through every business we touch (see “Ecosystem Components”).\n\nUnderstanding. We know the recurring problems of the business areas we serve — we call them domain pains — from minor daily equipment glitches to failures and poorly chosen technology that stop entire plants, because we spent years steeped in them as operators. Every ecosystem in our portfolio grew out of a pain we know by name (see “Business Domains”).\n\nCo-engineering. Our way is to become part of your team, work on one site and in one information space, and earn our bonuses on results we achieve together. Terms and incentives are written into the contract, not left in the slide deck (see “Project Culture”).\n\nAccountable scope. A systems approach means we own the full loop of pain removal — from the feasibility study through implementation to keeping the solution healthy across its whole lifecycle, including its eventual replacement with something better. “Not our department” is not spoken here: if it affects the outcome, it is our scope.\n\nProven Inside. Nearly every ecosystem runs its full lifecycle inside the Concern before we offer it to the market. The AI agents that answer calls, draft proposals, generate project documentation, write code, and evaluate project financial models are the very ones our own people use today. We offer a working system, not a render (see “AK.Family Ecosystems”).\n\nOpenness. We actively use third-party technology and welcome the integration of external solutions into our ecosystems. Our principle: the best tool for removing the pain should ultimately win the job — even an outside one (see “Cooperation”)."}, {"title": "Our Numbers", "quote": "18 years — the core team’s average professional experience: plant operations, engineering, capital projects, and adjacent-business launches.", "source": "Our Numbers", "kind": "numbers", "image": "", "items": ["18 years — the core team’s average professional experience: plant operations, engineering, capital projects, and adjacent-business launches.", "100+ — vetted professionals united in the AK.COmm professional community, mobilized per task or project.", "13 — deployment-ready agentic-AI ecosystems in the AK.Family portfolio, each built around a specific, recurring pain in a specific domain."], "notes": "18 years — the core team’s average professional experience: plant operations, engineering, capital projects, and adjacent-business launches.\n\n17 billion USD — the largest completed project in a 40+ billion USD greenfield oil and gas portfolio.\n\n23% — refinery productivity gain delivered by our team through combined technical and organizational measures.\n\n100+ — vetted professionals united in the AK.COmm professional community, mobilized per task or project.\n\n13 — deployment-ready agentic-AI ecosystems in the AK.Family portfolio, each built around a specific, recurring pain in a specific domain.\n\n3 — proprietary methodologies developed inside the Concern that govern how we launch new businesses, deliver projects, and assure quality."}, {"title": "A refinery from bare field in four years", "quote": "Marat Basharov and the core of today's AKCO team delivered the construction in cooperation with Fluor as the project-management contractor and more than a dozen international licensors", "source": "Reference Projects", "kind": "case", "image": "", "items": ["2006", "October 2010"], "notes": "A refinery from bare field in four years — Capital Projects domain. The reference: TANECO, Nizhnekamsk — a greenfield refining complex with a first-phase capacity of 7 million tonnes of crude per year and Phase 1 investment of some USD 5.8 billion. The pain: build a full-scale refinery from an open field — no site infrastructure, no operating team — while weaving the technologies of multiple licensors into one working whole. The approach: Marat Basharov and the core of today's AKCO team delivered the construction in cooperation with Fluor as the project-management contractor and more than a dozen international licensors — UOP, Axens, Shell Global Solutions, Haldor Topsoe, LyondellBasell among them — under one integrated project discipline. The result: from company formation in 2006 to first-phase startup in October 2010 — four years from green grass to a running refinery. The experience of orchestrating so many parties toward a single startup is the discipline now codified in the 4CO method and the AK.PRISM methodology."}, {"title": "Ecosystems Integrity Approach", "quote": "an ecosystem reaches maximum efficiency and sustainability only when its integrity holds across six dimensions.", "source": "Ecosystems Integrity Approach", "kind": "integrity", "image": "", "items": ["Portfolio integrity — AK.Family delivers a finished solution, not a scatter of components. Integration is our work before the contract, not the client's work after it.", "Deployment integrity — the assembled ecosystem starts its life at an AKCO facility and arrives in the client's environment already tuned and ready to run.", "Team integrity — client and AKCO are not two counterparties on opposite sides of a contract but one organism: shared dashboards, shared data, a shared definition of \"done.\"", "Integrity over time — we don't leave at handover; we stay in long-term service relationships. The most valuable data about any system starts arriving the day it is commissioned.", "Integrity of accountability — one Concern answers for the whole loop. \"Not our department\" is not spoken here; there is the outcome — and everything that affects it.", "Lifecycle integrity — from the feasibility study to service across the full operating life, in one scope of accountability. The team that designed the ecosystem answers for how it runs in year five."], "notes": "Drawing on this background, AKCO builds its ecosystems as closed-loop systems: an ecosystem reaches maximum efficiency and sustainability only when its integrity holds across six dimensions.\n\nPortfolio integrity — AK.Family delivers a finished solution, not a scatter of components. Integration is our work before the contract, not the client's work after it.\n\nDeployment integrity — the assembled ecosystem starts its life at an AKCO facility and arrives in the client's environment already tuned and ready to run.\n\nTeam integrity — client and AKCO are not two counterparties on opposite sides of a contract but one organism: shared dashboards, shared data, a shared definition of \"done.\"\n\nIntegrity over time — we don't leave at handover; we stay in long-term service relationships. The most valuable data about any system starts arriving the day it is commissioned.\n\nIntegrity of accountability — one Concern answers for the whole loop. \"Not our department\" is not spoken here; there is the outcome — and everything that affects it.\n\nLifecycle integrity — from the feasibility study to service across the full operating life, in one scope of accountability. The team that designed the ecosystem answers for how it runs in year five.\n\nIntegrity has a price — it takes a concern, not a vendor. Fragmented suppliers will always quote lower on any single layer; none of them can guarantee the whole. Clients who have paid the integration tax need no convincing; everyone else, the industry will convince in due course."}, {"title": "4CO", "quote": "The four practices below work as one, like the parts of a single score, and together they carry even the most complex projects to the finish.", "source": "Project Practice", "kind": "method", "image": "", "items": ["COmpose (compose the proposed solution)", "COnsolidate (consolidate project resources)", "COncert (coordinate participants and resources intelligently)", "COntribute (cooperate with the world)"], "notes": "AKCO approaches project delivery the way its name obliges: systematically and intelligently. The 4CO method grew out of the team's hands-on experience — from automation-system rollouts to turnkey construction of major new industrial facilities. The four practices below work as one, like the parts of a single score, and together they carry even the most complex projects to the finish.\n\nCOmpose (compose the proposed solution)\n\nCompose the goal of the implementation and the vision of the result: uncover the pains and opportunities and define the target outcome — in implementation, operation, and maintenance terms — at the study and survey stage:\n\nStart with the problems and the potential. Every project opens with a plain statement of where the value deficit sits — financial, operational, or technical — written down before anyone talks solutions. The baseline is fixed in the same breath: current costs, losses, and output, measured and on record. A well-stated problem is half the solution.\n\nFollow the method, not intuition. Before a contract is signed, run a structured site survey and turn it into a detailed statement of work — the foundation the contract is built on. Engineering standards apply from day one. Pre-project studies are not paperwork: they are where we and the client decide, together, whether the project deserves to exist.\n\nDeploy an ecosystem, not a set of products. The pains and needs we uncovered drive the choice of components — and those components reach the client already integrated: a full-cycle ecosystem, one scope of accountability. The client gets a ready-to-use result, not one more integration project to manage.\n\nCOnsolidate (consolidate project resources)\n\nBring the project’s resources together into one whole: the team, subcontractors, tools, and the Concern’s internal services:\n\nBuild an integrated team. One project team, drawn from three sources: the client's staff, the AKCO project office, and subcontractors. Everyone works in the same information environment, on the same automation tools, and everyone's incentives ride on the same project KPIs. When a project's complexity or novelty calls for it, experts from the AK.COmm professional community step in to reinforce the team.\n\nEngage proven resources. Nothing on the project is sourced cold: through the AK.Grid partner network, crews, suppliers, and equipment are lined up in advance — all of them proven on joint projects, all of them experienced under the AKCO project office.\n\nPlug in the Concern's internal services. No project starts from scratch: the project office arrives with its own procedures and AKCore™ AI instruments from the first week, AK.Office runs the back office — finance, logistics, administration — and the AK.Staff pool absorbs mobilization peaks without permanent hires. The client sees one team; the Concern's whole infrastructure stands behind it.\n\nCOncert (coordinate participants and resources intelligently)\n\nProvide centralized management of project delivery, quality, and resource spend, concentrating accountability in one place:\n\nModel the object. Digitize and model the object of the project — a process, an operation, a production unit, an entire enterprise — capturing its interfaces, behavior, criticality, and evolution from a standard set of source data and procedures. Kept current through delivery, the model is the score every participant plays from: decisions are checked against it, not against recollections.\n\nApply our own project management methodology, AK.PRISM (see Section 7). One and the same set of methodology tools and documents can be configured for any project — predictive, iterative, or hybrid — depending on task types and risks. AK.PRISM is not a binder of documents; it is the operating system of every project office the Concern runs, reinforced by digital assistants.\n\nApply our own quality methodology, AK.CANON (see Section 7). It joins three kinds of control into a single loop: strategic QA owns the project outcome as a whole; process QC verifies at defined points — inspections, tests, quality gates; operational QC monitors continuously through real-time metrics. AK.CANON relies on data gathered by digital assistants, not on opinions. Its aim is to prevent nonconformities and deviations, not merely correct them.\n\nCOntribute (cooperate with the world)\n\nUse the project's results wisely: count not only the profit earned but the lessons drawn from mistakes — and the prospects that open up:\n\nMeasure the result on the client’s terms. Judge the project's success and effectiveness against the client's expectations and requirements as set out in the statement of work and the contract.\n\nCreate value beyond the contract. Don't stop at contractual obligations; take an active part in developing the industries and communities we work with. That value shows up in concrete actions: a safer plant, a site team trained in new methods, modern technology brought into use.\n\nDraw lessons from every project. A project closes with a careful review: shortcomings, risks averted, and defenses that held are all assessed. The lessons enter a dedicated register and feed the next editions of our methodologies — so each new project starts smarter than the last.\n\nGrow the partner network and the portfolio. Partners and suppliers who prove themselves on real projects expand the AK.Grid network. Solutions developed inside projects become products and return to the catalog, and newly uncovered problems go to research and development."}, {"title": "Start with the problems and the potential.", "quote": "Before a contract is signed, run a structured site survey and turn it into a detailed statement of work — the foundation the contract is built on.", "source": "Project Practice", "kind": "start", "image": "img/4a346e87f59f.webp", "items": [], "notes": "AKCO approaches project delivery the way its name obliges: systematically and intelligently. The 4CO method grew out of the team's hands-on experience — from automation-system rollouts to turnkey construction of major new industrial facilities. The four practices below work as one, like the parts of a single score, and together they carry even the most complex projects to the finish.\n\nCOmpose (compose the proposed solution)\n\nCompose the goal of the implementation and the vision of the result: uncover the pains and opportunities and define the target outcome — in implementation, operation, and maintenance terms — at the study and survey stage:\n\nStart mart Systems Industrial Plant Equipment — FZCO.\n\nAK.PORTAL — AKCO’s technology news portal: weekly digests of what the Concern actually works with, with one-click subscription (see Section 7).\n\nWrite to us at any hour — the front door never closes. Our digital inbound agent, built on AKCore™ AI, staffs every channel around the clock: it reads, routes, and replies — no office hours, no time zones, no 'please hold' — and hands you to a named person the moment your question needs one. It is also the most honest demo we have: the first AKCO product you meet is the one we trust with our own front door."}, {"title": "Asset Reliability and Performance", "quote": "“The syngas compressor died mid-shift — the whole chain went down; we count the outage in hundreds of millions.”", "source": "Domains Within Our Competence", "kind": "appendix", "image": "img/825035f8758f.webp", "items": ["The domain covers dependable operation of critical machinery, managed through OEE and MTBF — overall equipment effectiveness and mean time between failures. It includes predictive diagnostics of rotating equipment, condition monitoring of components, and risk-based maintenance management. The offered solution is the AKSense.Guard ecosystem (see Section 4): sensors, mathematical models, and agentic AI for diagnostics on critical machines. Once the ecosystem is deployed, maintenance schedules follow measured remaining useful life, spare parts arrive before failures, and the maintenance budget is defended in advance."], "notes": "Every domain below grew out of real problems and real opportunities — the kind we've spent 25+ years learning in operations, the kind we still hear on plant sites and in boardrooms. If one sounds like your Monday, that domain is yours.\n\n1. Asset Reliability and Performance — The domain covers dependable operation of critical machinery, managed through OEE and MTBF — overall equipment effectiveness and mean time between failures. It includes predictive diagnostics of rotating equipment, condition monitoring of components, and risk-based maintenance management. The offered solution is the AKSense.Guard ecosystem (see Section 4): sensors, mathematical models, and agentic AI for diagnostics on critical machines. Once the ecosystem is deployed, maintenance schedules follow measured remaining useful life, spare parts arrive before failures, and the maintenance budget is defended in advance.\n\n“The syngas compressor died mid-shift — the whole chain went down; we count the outage in hundreds of millions.”\n\n“We learned about the urea pump’s vibration only when the bearing was already coming apart.”\n\n“Planned turnarounds cut our revenue even though half the equipment could have kept running.”\n\n2. Process Control and Quality — The domain covers automated production management, real-time monitoring of process and production parameters, quality control of feedstock, product, and utilities, and deviation management on continuous plants. The offered solution is the AKCore.MES ecosystem — a manufacturing execution system (see Section 4): wireless AKSense™ sensors for gray zones, digital twins of processes and equipment, and decision support powered by digital assistants. Once the ecosystem is deployed, deviations are caught as they emerge, balances close daily, and the lab confirms what the model has already shown.\n\n“We close material balances in Excel — the data arrives a day late.”\n\n“NPK granule quality drifts from shift to shift, and nobody can say why.”\n\n“Gas consumption has run five to seven percent over norm for years, and we chase the cause for weeks.”\n\n3. Power and Efficiency — The domain covers guaranteed power supply for remote sites and energy-intensive consumers where connecting to the grid is impractical or uneconomical. The offered solution is the AKFlow.Power ecosystem (see Section 4): mobile, rapidly deployable generation from available fuels (LNG, biofuel, waste), energy storage for uneven consumption, unmanned automatic control of power supply and switching, and decision support powered by digital assistants. Dedicated mobile solutions for data centers are available. Once the ecosystem is deployed, energy becomes a predictable, manageable factor: guaranteed availability, a predictable price per kilowatt-hour, and recovered heat folded into the site’s energy balance.\n\n“Diesel generation eats the budget, and a grid connection means years and millions.”\n\n“Grid sags and outages stop the unit right in the middle of a shift.”\n\n“We vent heat to the atmosphere while the site itself needs it.”\n\n4. Life Support — The domain covers life-support systems for buildings, special-purpose rooms, and autonomous climate zones. The offered solution is the AKSense.Climate ecosystem (see Section 4): intelligent ventilation, modern energy-efficient technology, air-quality control, and unmanned automatic operation, with service across the full lifecycle. Deploying the ecosystem creates a healthy microclimate, keeping air quality within set limits whatever the outside conditions.\n\n“The air is stale — dry, musty — yet on paper the system is working fine.”\n\n“Noise and poor control: one wing is roasting, the other is freezing.”\n\n“We are short of capacity: the sizing was done by eye, and the systems fight each other.”\n\n5. Ecology and Recycling — The domain covers a broad environmental agenda: closed water loops, waste processing, water treatment, and sustainable greening of territories. The offered solutions are the AKFlow.Cycle and AKFlow.Harvest ecosystems (see Section 4): solid-waste pyrolysis technology, water treatment for various applications, biological purification, plant selection and man-made green oases, plant-growth control, unmanned automatic operation. Deployment reduces the load on the environment, lowers operating costs, and supports public land-development programs. Typically applied together with AKSense.Climate.\n\n“Waste disposal fees climb every year, and the landfills keep closing — hauling keeps getting more expensive.”\n\n“Old greenhouses’ energy bills kill the margin, and agronomists simply are not on the market.”\n\n6. Business Operations and Digital Transformation — The domain covers automation of internal business processes and better quality and traceability of company operations. The offered solution is the AKCore.Boost ecosystem built on the AKCore™ applied AI component line (see Section 4): enterprise management systems with ERP functionality, business analytics, CRM, internal integration, proposal preparation, inbound processing, financial transactions, and wide use of digital assistants and intelligent RPA automation to connect external applications with corporate systems.\n\n“A proposal takes days of our best engineers’ time — and a competitor files in two.”\n\n“Inbound leads get lost and go cold; analytics comes only through IT, on request.”\n\n“Knowledge walks out with the people, and AI pilots never make it to production.”\n\n7. Business Services and Finance — The domain covers a wide range of business-support needs, including the launch of new cross-border ventures. The offered solution is the AK.Desk ecosystem (see Section 4): operating-staff leasing, external project management, accounting and tax, financial operations, marketing and sales promotion. Deploying the ecosystem lets clients launch new businesses quickly without hiring, cut operating and overhead costs, and stay focused on their core work.\n\n“Bank compliance eats months — the account does not open by itself.”\n\n“We picked the wrong free zone — now we overpay for licenses and taxes.”\n\n“The cross-border payment stays blocked until you have a local presence and a local team.”\n\n8. Capital Projects — The domain covers the initiation, launch, and delivery of large capital-investment projects: feasibility studies and bankability, project office setup, management of engineering, procurement, and construction, through commissioning and trial operation. The proposed solution — the AK.Prime ecosystem (see Section 4): a ready project office of specialists and discipline leads, working to the AK.PRISM methodology with AKCore™ AI instruments from the first week, reinforced by AK.Talent mobilization and the AK.Staff pool. After deployment, the owner gets transparency and a predictable startup instead of budget erosion at the seams between contractors.\n\n\"The investment decision is signed — and there is no one to execute it.\"\n\n\"Every contractor blames the next one, and the overrun always lands on us.\"\n\n\"The schedule slips a month every quarter, and no one can say why.\"\n\nX. Research and Development (R&D) — The first eight domains run on ready ecosystems that solve known problems; the eXtra exists for everything else — tasks with no ready solution yet. Work lands here in two ways: a client's problem that no existing ecosystem can close, or an opportunity in a client's business that no one has engineered yet. The AKCO team researches the problem, models the object, prototypes the missing solution, and deploys it in real conditions. Solutions that prove themselves become products. Each new product joins the AK.Store component catalog and returns to the shared portfolio (see Section 8).", "visual": ["AKSense.Guard", "condition monitoring of components", "risk-based maintenance management", "maintenance schedules follow measured remaining useful life"]}, {"title": "Process Control and Quality", "quote": "“We close material balances in Excel — the data arrives a day late.”", "source": "Domains Within Our Competence", "kind": "appendix", "image": "img/4116e5f593fd.webp", "items": ["The domain covers automated production management, real-time monitoring of process and production parameters, quality control of feedstock, product, and utilities, and deviation management on continuous plants. The offered solution is the AKCore.MES ecosystem — a manufacturing execution system (see Section 4): wireless AKSense™ sen gement, accounting and tax, financial operations, marketing and sales promotion. Deploying the ecosystem lets clients launch new businesses quickly without hiring, cut operating and overhead costs, and stay focused on their core work.\n\n“Bank compliance eats months — the account does not open by itself.”\n\n“We picked the wrong free zone — now we overpay for licenses and taxes.”\n\n“The cross-border payment stays blocked until you have a local presence and a local team.”\n\n8. Capital Projects — The domain covers the initiation, launch, and delivery of large capital-investment projects: feasibility studies and bankability, project office setup, management of engineering, procurement, and construction, through commissioning and trial operation. The proposed solution — the AK.Prime ecosystem (see Section 4): a ready project office of specialists and discipline leads, working to the AK.PRISM methodology with AKCore™ AI instruments from the first week, reinforced by AK.Talent mobilization and the AK.Staff pool. After deployment, the owner gets transparency and a predictable startup instead of budget erosion at the seams between contractors.\n\n\"The investment decision is signed — and there is no one to execute it.\"\n\n\"Every contractor blames the next one, and the overrun always lands on us.\"\n\n\"The schedule slips a month every quarter, and no one can say why.\"\n\nX. Research and Development (R&D) — The first eight domains run on ready ecosystems that solve known problems; the eXtra exists for everything else — tasks with no ready solution yet. Work lands here in two ways: a client's problem that no existing ecosystem can close, or an opportunity in a client's business that no one has engineered yet. The AKCO team researches the problem, models the object, prototypes the missing solution, and deploys it in real conditions. Solutions that prove themselves become products. Each new product joins the AK.Store component catalog and returns to the shared portfolio (see Section 8).", "visual": ["AKCore.MES", "digital twins of processes and equipment", "decision support powered by digital assistants", "balances close daily"]}, {"title": "Power and Efficiency", "quote": "“Diesel generation eats the budget, and a grid connection means years and millions.”", "source": "Domains Within Our Competence", "kind": "appendix", "image": "img/39625a1aa576.webp", "items": ["The domain covers guaranteed power supply for remote sites and energy-intensive consumers where connecting to the grid is impractical or uneconomical. The offered solution is the AKFlow.Power ecosystem (see Section 4): mobile, rapidly deployable generation from available fuels (LNG, biofuel, waste), energy storage for uneven consumption, unmanned automatic control of power supply and switching, and decision support powered by digital assistants. Dedicated mobile solutions for data centers are available. Once the ecosystem is deployed, energy becomes a predictable, manageable factor: guaranteed availability, a predictable price per kilowatt-hour, and recovered heat folded into the site’s energy balance."], "notes": "Every domain below grew out of real problems and real opportunities — the kind we've spent 25+ years learning in operations, the kind we still hear on plant sites and in boardrooms. If one sounds like your Monday, that domain is yours.\n\n1. Asset Reliability and Performance — The domain covers dependable operation of critical machinery, managed through OEE and MTBF — overall equipment effectiveness and mean time between failures. It includes predictive diagnostics of rotating equipment, condition monitoring of components, and risk-based maintenance management. The offered solution is the AKSense.Guard ecosystem (see Section 4): sensors, mathematical models, and agentic AI for diagnostics on critical machines. Once the ecosystem is deployed, maintenance schedules follow measured remaining useful life, spare parts arrive before failures, and the maintenance budge  solution is the AKCore.Boost ecosystem built on the AKCore™ applied AI component line (see Section 4): enterprise management systems with ERP functionality, business analytics, CRM, internal integration, proposal preparation, inbound processing, financial transactions, and wide use of digital assistants and intelligent RPA automation to connect external applications with corporate systems.\n\n“A proposal takes days of our best engineers’ time — and a competitor files in two.”\n\n“Inbound leads get lost and go cold; analytics comes only through IT, on request.”\n\n“Knowledge walks out with the people, and AI pilots never make it to production.”\n\n7. Business Services and Finance — The domain covers a wide range of business-support needs, including the launch of new cross-border ventures. The offered solution is the AK.Desk ecosystem (see Section 4): operating-staff leasing, external project management, accounting and tax, financial operations, marketing and sales promotion. Deploying the ecosystem lets clients launch new businesses quickly without hiring, cut operating and overhead costs, and stay focused on their core work.\n\n“Bank compliance eats months — the account does not open by itself.”\n\n“We picked the wrong free zone — now we overpay for licenses and taxes.”\n\n“The cross-border payment stays blocked until you have a local presence and a local team.”\n\n8. Capital Projects — The domain covers the initiation, launch, and delivery of large capital-investment projects: feasibility studies and bankability, project office setup, management of engineering, procurement, and construction, through commissioning and trial operation. The proposed solution — the AK.Prime ecosystem (see Section 4): a ready project office of specialists and discipline leads, working to the AK.PRISM methodology with AKCore™ AI instruments from the first week, reinforced by AK.Talent mobilization and the AK.Staff pool. After deployment, the owner gets transparency and a predictable startup instead of budget erosion at the seams between contractors.\n\n\"The investment decision is signed — and there is no one to execute it.\"\n\n\"Every contractor blames the next one, and the overrun always lands on us.\"\n\n\"The schedule slips a month every quarter, and no one can say why.\"\n\nX. Research and Development (R&D) — The first eight domains run on ready ecosystems that solve known problems; the eXtra exists for everything else — tasks with no ready solution yet. Work lands here in two ways: a client's problem that no existing ecosystem can close, or an opportunity in a client's business that no one has engineered yet. The AKCO team researches the problem, models the object, prototypes the missing solution, and deploys it in real conditions. Solutions that prove themselves become products. Each new product joins the AK.Store component catalog and returns to the shared portfolio (see Section 8).", "visual": ["AKCore.Boost", "enterprise management systems with ERP functionality", "wide use of digital assistants", "better quality and traceability of company operations"]}, {"title": "Business Services and Finance", "quote": "“Bank compliance eats months — the account does not open by itself.”", "source": "Domains Within Our Competence", "kind": "appendix", "image": "", "items": ["The domain covers a wide range of business-support needs, including the launch of new cross-border ventures. The offered solution is the AK.Desk ecosystem (see Section 4): operating-staff leasing, external project management, accounting and tax, financial operations, marketing and sales promotion. Deploying the ecosystem lets clients launch new businesses quickly without hiring, cut operating and overhead costs, and stay focused on their core work."], "notes": "Every domain below grew out of real problems and real opportunities — the kind we've spent 25+ years learning in operations, the kind we still hear on plant sites and in boardrooms. If one sounds like your Monday, that do , the same channel that today operates as the AK.Staff pool and the AK.COmm community. The result: a fully working project office three months after project initiation. That same mobilization machinery is now packaged as AK.Talent: teams on site in days, scaled back down the moment the peak passes.", "source": "Proof Track by Domain", "kind": "reference", "image": "", "items": [], "notes": "Project launched, no team to run it — Capital Projects domain. The reference: the Baltic Chemical Complex at Ust-Luga — one of the world's largest polyethylene projects, sized at 3 million tonnes of PE per year on 3.6 million tonnes of ethane feed, with capital expenditure of some EUR 10 billion. The pain: a mega-project moving from initiation into execution with no project office to run it — against conventional hiring cycles of three to six months and a schedule already ticking. The approach: mobilization under the discipline that later became the Concern's procedures — Marat Basharov assembled the complex's project office through direct engagement of proven specialists, the same channel that today operates as the AK.Staff pool and the AK.COmm community. The result: a fully working project office three months after project initiation. That same mobilization machinery is now packaged as AK.Talent: teams on site in days, scaled back down the moment the peak passes.", "visual": ["a mega-project moving from initiation into execution with no project office to run it", "Marat Basharov assembled the complex's project office through direct engagement of proven specialists", "a fully working project office three months after project initiation"]}, {"title": "Structure", "quote": "AKCO is a concern that currently unites five interconnected legal entities, reinforced by a professional community and operating under a single parent brand. Within this structure, each participant’s role and its contribution to the shared value chain are clearly defined.", "source": "Structure", "kind": "reference", "image": "", "items": [], "notes": "AKCO is a concern that currently unites five interconnected legal entities, reinforced by a professional community and operating under a single parent brand. Within this structure, each participant’s role and its contribution to the shared value chain are clearly defined.\n\nSmart Systems Industrial Plant Equipment FZCO (Dubai, UAE) — corporate headquarters and flagship of the Concern: holder of the brand, trademarks, and patents; sets strategy and methodology; leads advanced research and the development of new solutions. The company mobilizes project resources across the group, provides technology expertise, delivers PMC project consulting, and develops new business lines (see www.aksystems.co).\n\nAKFinance Advisory Services FZCO (Dubai, UAE) — the Concern's financial backbone: asset and finance management, management accounting and internal cost transfers, business administration — and the launchpad for new companies, inside the group and beyond (see www.akfinance.ae).\n\nShanghai AKSENSE Technology Co., Ltd. (Shanghai, China) — the Concern's manufacturing hub: component sourcing and purchasing, contract manufacturing and equipment supply, supply-chain logistics — with quality assurance built into every step (see www.aksense.org).\n\nAK.COmm (CIS countries) — the Concern's expert engineering pool: a community of 100+ vetted professionals across engineering and design, project delivery, IT/OT, and software development, mobilized onto projects by specialty (see www.aksystems.org).\n\nWithin the structure, each business unit owns its area, and everything converges in one cross-border operations center. In orbit around it: technology suppliers, service and manufacturing companies, and trading agents — the Concern's partner network."}, {"title": "AK.Grid", "quote": "AKCO is an open Concern looking to the future. We believe in mutual benefit and in 1 + 1 = 3 synergy between intelligent people and professional companies, whatever badge they wear. We meet and work with hundreds of colleagues around the world — after all, the world is small, and connection is something we simply need. At a time when the world drifts toward separation, we call for joining forces. If you feel the same, the link below is for you.", "source": "AKCO’s Vision of Cooperation", "kind": "reference", "image": "", "items": [], "notes": "AKCO is an open Concern looking to the future. We believe in mutual benefit and in 1 + 1 = 3 synergy between intelligent people and professional companies, whatever badge they wear. We meet and work with hundreds of colleagues around the world — after all, the world is small, and connection is something we simply need. At a time when the world drifts toward separation, we call for joining forces. If you feel the same, the link below is for you.\n\nThe doors of AK.Grid are open to everyone who builds: freelancers and manufacturers, suppliers and specialized contractors, integrators and technology partners. Any form of cooperation counts — vertical or horizontal: solution integration, joint development, project delivery, trading, investment, startups. And partnership, as we understand it, is more than contracts: it is a shared road of growth, where management, quality, and sustainability practices travel freely between our teams and yours — owners to owners, engineers to engineers."}];

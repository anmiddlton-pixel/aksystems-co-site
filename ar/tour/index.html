شاريع على مستوى المجموعة، وتقدّم الخبرة التقنية، وخدمات استشارات إدارة المشاريع PMC، وتطوّر خطوط أعمال جديدة (انظر www.aksystems.co).\n\nAKFinance Advisory Services FZCO (دبي، الإمارات العربية المتحدة) — العمود المالي للمجموعة: إدارة الأصول والشؤون المالية، والمحاسبة الإدارية وتحويلات التكاليف الداخلية، وإدارة الأعمال — ومنصّة انطلاق الشركات الجديدة، داخل المجموعة وخارجها (انظر www.akfinance.ae).\n\nShanghai AKSENSE Technology Co., Ltd. (شانغهاي، الصين) — المركز الإنتاجي للمجموعة: توريد المكوّنات وشراؤها، والتصنيع التعاقدي وتوريد المعدات، ولوجستيات سلسلة الإمداد — مع ضمان الجودة مدمجاً في كل خطوة (انظر www.aksense.org).\n\nAK.COmm (دول رابطة الدول المستقلة) — المجمّع الهندسي الخبير للمجموعة: مجتمع من أكثر من 100 محترف مُتحقَّق من كفاءته في الهندسة والتصميم، وتنفيذ المشاريع، وتقنية المعلومات/التشغيل، وتطوير البرمجيات، يُحشدون على المشاريع بحسب التخصّص (انظر www.aksystems.org).\n\nوضمن الهيكل، تملك كل وحدة أعمال مجالها، ويتلاقى كل شيء في مركز عمليات واحد عابر للحدود. وفي مداره: موردو التقنيات، وشركات الخدمات والتصنيع، والوكلاء التجاريون — شبكة شركاء المجموعة."},{"title":"AK.Grid","quote":"AKCO مجموعة منفتحة تتطلّع إلى المستقبل. نؤمن بالمنفعة المتبادلة وبتآزر 1 + 1 = 3 بين العقلاء والشركات المهنية، أياً كان الشعار الذي يحملونه. نلتقي ونعمل مع مئات الزملاء حول العالم — فالعالم صغير، والتواصل حاجة لا غنى لنا عنها. وفي وقت يتّجه فيه العالم نحو الانفصال، ندعو إلى توحيد الجهود. فإن كنت تشعر بالشيء نفسه، فالرابط أدناه لك.","source":"رؤية AKCO للتعاون","kind":"reference","image":"","items":[],"notes":"AKCO مجموعة منفتحة تتطلّع إلى المستقبل. نؤمن بالمنفعة المتبادلة وبتآزر 1 + 1 = 3 بين العقلاء والشركات المهنية، أياً كان الشعار الذي يحملونه. نلتقي ونعمل مع مئات الزملاء حول العالم — فالعالم صغير، والتواصل حاجة لا غنى لنا عنها. وفي وقت يتّجه فيه العالم نحو الانفصال، ندعو إلى توحيد الجهود. فإن كنت تشعر بالشيء نفسه، فالرابط أدناه لك.\n\nأبواب AK.Grid مفتوحة لكل من يبني: المستقلّون والمصنّعون، والموردون والمقاولون المتخصّصون، والمُكامِلون وشركاء التقنية. وأيّ شكل من التعاون محسوب — enrich=function(d,n){beforeBottomDetails(d,n);if(n<12)return;const stage=$('#screen');stage.classList.add('bottom-details-slide');const panel=stage.querySelector('.appendix-side-panel');if(panel)panel.remove();const flow=stage.querySelector('.appendix-flow');const info=appendixMore[n-12];const band=document.createElement('div');band.className='bottom-detail-band';band.innerHTML='<div class="bottom-band-title">'+esc(info[0])+'</div><div class="bottom-band-items">'+info[1].map((t,i)=>'<div>'+icon(['scope','code','check'][i])+'<p>'+esc(t)+'</p></div>').join('')+'</div>';stage.insertBefore(band,flow)};

$('#next').onclick=()=>show(n+1);$('#prev').onclick=()=>show(n-1);$('#contents').onclick=()=>$('#menu').showModal();$('#detail').onclick=()=>{const d=slides[n];$('#ntitle').textContent=d.title;$('#source').textContent=d.source;$('#nbody').textContent=d.notes;$('#notes').showModal()};document.querySelectorAll('dialog .close').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('#index').innerHTML=slides.map((d,i)=>'<button data-index="'+i+'">'+(i<12?String(i+1).padStart(2,'0'):'A'+(i-11))+' / '+esc(d.title)+'</button>').join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{$('#menu').close();show(+b.dataset.index)});document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(n+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(n-1)}if(e.key==='Home')show(0);if(e.key==='End')show(11)});
const AUTO_INTERVAL=15000;
let autoPlaying=true,autoElapsed=0,autoLastTick=performance.now();
const playerShow=show;
show=function(i){playerShow(i);autoElapsed=0;autoLastTick=performance.now();$('#count').textContent=(n+1)+' / '+slides.length;syncPlayer()};
function syncPlayer(){const control=$('#play-toggle');if(!control)return;control.innerHTML=autoPlaying?'<span class="pause-icon" aria-hidden="true">Ⅱ</span>':'<span class="play-icon" aria-hidden="true"></span>';control.setAttribute('aria-label',autoPlaying?'إيقاف العرض مؤقتًا':'تشغيل العرض');control.setAttribute('aria-pressed',String(autoPlaying));control.style.setProperty('--elapsed',(autoElapsed/AUTO_INTERVAL*100)+'%')}
function togglePlayer(){autoPlaying=!autoPlaying;if(autoPlaying&&n===slides.length-1)show(0);autoLastTick=performance.now();syncPlayer()}
$('#play-toggle').onclick=togglePlayer;
document.addEventListener('keydown',e=>{if(e.code!=='Space'||document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT|BUTTON|A/.test(e.target.tagName)||e.target.isContentEditable)return;e.preventDefault();togglePlayer()});
let swipeStart=null;
const swipeArea=$('#screen');swipeArea.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('a,button,input')){swipeStart=null;return}swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});swipeArea.addEventListener('touchend',e=>{if(!swipeStart)return;const touch=e.changedTouches[0],dx=touch.clientX-swipeStart.x,dy=touch.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)show(n+(dx<0?1:-1))},{passive:true});
document.addEventListener('visibilitychange',()=>{autoLastTick=performance.now()});
setInterval(()=>{const now=performance.now(),delta=Math.min(now-autoLastTick,500);autoLastTick=now;if(!document.querySelector('#play-toggle')||!autoPlaying||document.hidden||document.querySelector('dialog[open]'))return;autoElapsed+=delta;if(autoElapsed>=AUTO_INTERVAL){if(n<slides.length-1)show(n+1);else{autoPlaying=false;autoElapsed=0}}const control=$('#play-toggle');control.style.setProperty('--elapsed',(autoElapsed/AUTO_INTERVAL*100)+'%');if(!autoPlaying)syncPlayer()},150);

show((parseInt(location.hash.slice(1))||1)-1);

// On narrow screens preserve a desktop slide canvas and fit it to screen width.
if(window.self===window.top && window.innerWidth<=700){
 const canvasWidth=1440,canvasHeight=938;
 const source='<!doctype html>'+document.documentElement.outerHTML;
 const currentSlide=location.hash||'#1';
 const frame=document.createElement('iframe');frame.title='AKCO presentation';frame.setAttribute('aria-label','شرائح أفقية مُقاسة إلى عرض الشاشة');frame.style.cssText='position:absolute;left:0;top:0;border:0;width:1440px;height:938px;transform-origin:top left;background:#232426';
 const holder=document.createElement('div');holder.style.cssText='position:relative;width:100%;overflow:hidden;flex:none';holder.appendChild(frame);
 document.body.replaceChildren(holder);document.body.style.cssText='margin:0;background:#232426;min-height:100svh;height:auto;display:flex;align-items:center;justify-content:center;overflow-x:hidden;overflow-y:auto';
 function sizeCanvas(){const scale=window.innerWidth/canvasWidth;frame.style.transform='scale('+scale+')';holder.style.height=(canvasHeight*scale)+'px'}
 sizeCanvas();window.addEventListener('resize',sizeCanvas);
 frame.srcdoc=source;
 frame.addEventListener('load',()=>{const child=frame.contentWindow;child.location.hash=currentSlide;child.show(Math.max(0,(parseInt(currentSlide.slice(1))||1)-1));});
}
